name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"   # 19:00 IST daily, after most mandis have reported for the day

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Refresh the mandi dashboard data. Fails soft: if the secret is missing, data.gov.in is
      # unreachable, or too few records come back, the site deploys with the data already committed.
      - name: Refresh live mandi data
        if: env.DATA_GOV_API_KEY != ''
        continue-on-error: true
        timeout-minutes: 8   # a slow data.gov.in must never block the deploy
        run: python3 site/demo/mandi/fetch_live.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
